name: Build patched musl for Termux (native aarch64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment
        run: |
          uname -m
          gcc -dumpmachine
          which gcc make ld ar

      - name: Configure musl (native)
        run: |
          ./configure --prefix=$PWD/dist --syslibdir=$PWD/dist

      - name: Build musl
        run: make -j$(nproc)

      - name: Install
        run: make install

      - name: Verify and prepare artifact
        run: |
          ls -la dist/lib/
          test -f dist/lib/libc.so || { echo "::error::libc.so not found"; exit 1; }
          file dist/lib/libc.so
          cp dist/lib/libc.so dist/ld-musl-aarch64.so.1

      - uses: actions/upload-artifact@v4
        with:
          name: musl-termux-aarch64
          path: |
            dist/ld-musl-aarch64.so.1
            dist/lib/
            dist/include/
          retention-days: 30
