name: Build patched musl for Termux (native aarch64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment
        run: |
          uname -m
          gcc -dumpmachine
          which gcc make ld ar

      - name: Configure musl (native)
        run: |
          ./configure --prefix=$PWD/dist --syslibdir=$PWD/dist

      - name: Build musl
        run: make -j$(nproc)

      - name: Install
        run: make install

      - name: Verify artifacts
        run: |
          ls -la dist/
          ls -la dist/lib/
          test -f dist/lib/libc.so || { echo "::error::libc.so not found"; exit 1; }
          file dist/lib/libc.so
          # musl installs ld-musl-aarch64.so.1 as symlink to lib/libc.so
          ls -la dist/ld-musl-aarch64.so.1 || echo "(no symlink, will copy manually)"

      - name: Prepare artifact dir
        run: |
          mkdir -p artifact
          # نسخ libc.so الفعلي (مش symlink) تحت اسم loader
          cp -f dist/lib/libc.so artifact/ld-musl-aarch64.so.1
          # نسخ باقي الملفات
          cp -a dist/lib artifact/lib
          cp -a dist/include artifact/include
          ls -la artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: musl-termux-aarch64
          path: artifact/
          retention-days: 30
