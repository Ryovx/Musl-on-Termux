name: Build patched musl for Termux (prebuilt toolchain)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt musl-cross toolchain (aarch64, GCC 16)
        run: |
          URL="https://github.com/AmanoTeam/musl-gcc-cross/releases/download/gcc-16/aarch64-unknown-linux-musl.tar.xz"
          for i in 1 2 3; do
            if curl -fsSL --connect-timeout 30 --max-time 600 "$URL" -o toolchain.tar.xz; then
              break
            fi
            echo "Retry $i failed, waiting..."
            sleep 10
          done
          test -f toolchain.tar.xz || { echo "::error::download failed"; exit 1; }
          tar -xJf toolchain.tar.xz

      - name: Locate real gcc
        run: |
          echo "=== Top-level bin ==="
          ls -la "$PWD/musl-gcc-cross/bin/" | head -40
          echo "=== Find gcc ==="
          find "$PWD/musl-gcc-cross" -name "*gcc*" -type f 2>/dev/null | head -10

      - name: Configure musl
        run: |
          GCC="$PWD/musl-gcc-cross/bin/aarch64-unknown-linux-musl-gcc"
          if [ ! -x "$GCC" ]; then
            echo "::error::gcc not found at $GCC"
            echo "Trying to find gcc..."
            find "$PWD/musl-gcc-cross" -name "*gcc*" -type f 2>/dev/null
            exit 1
          fi
          echo "Using GCC: $GCC"
          "$GCC" --version
          CC="$GCC" ./configure \
            --target=aarch64-linux-musl \
            --prefix=$PWD/dist \
            --syslibdir=$PWD/dist

      - name: Build musl
        run: |
          GCC="$PWD/musl-gcc-cross/bin/aarch64-unknown-linux-musl-gcc"
          make -j$(nproc) CC="$GCC"

      - name: Install to dist
        run: make install

      - name: Verify and rename
        run: |
          test -f dist/lib/libc.so || { echo "::error::libc.so missing"; ls -la dist/lib/ 2>/dev/null; exit 1; }
          file dist/lib/libc.so
          cp dist/lib/libc.so dist/ld-musl-aarch64.so.1

      - uses: actions/upload-artifact@v4
        with:
          name: musl-termux-aarch64
          path: |
            dist/ld-musl-aarch64.so.1
            dist/lib/
            dist/include/
          retention-days: 30
