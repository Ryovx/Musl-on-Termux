name: Build patched musl for Termux (prebuilt toolchain)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt musl-cross toolchain (aarch64, GCC 16)
        run: |
          URL="https://github.com/AmanoTeam/musl-gcc-cross/releases/download/gcc-16/aarch64-unknown-linux-musl.tar.xz"
          for i in 1 2 3; do
            if curl -fsSL --connect-timeout 30 --max-time 600 "$URL" -o toolchain.tar.xz; then
              break
            fi
            echo "Retry $i failed, waiting..."
            sleep 10
          done
          test -f toolchain.tar.xz || { echo "::error::download failed"; exit 1; }
          # .tar.xz يحتاج -xJf
          tar -xJf toolchain.tar.xz
          ls -la
          find . -maxdepth 3 -type d -name bin | head -5

      - name: Add toolchain to PATH
        run: |
          TOOLCHAIN_DIR=$(find $PWD -maxdepth 2 -type d -name "*aarch64*" | head -1)
          echo "Toolchain dir: $TOOLCHAIN_DIR"
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "::error::toolchain dir not found"
            ls -la
            exit 1
          fi
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          ls -la $(dirname $(which aarch64-unknown-linux-musl-gcc 2>/dev/null || which aarch64-linux-musl-gcc 2>/dev/null)) 2>/dev/null || true
          # جرّب كلا الاسمين
          aarch64-unknown-linux-musl-gcc --version || aarch64-linux-musl-gcc --version

      - name: Configure musl
        run: |
          # جرّب كلا الاسمين
          if command -v aarch64-unknown-linux-musl-gcc >/dev/null 2>&1; then
            export CC=aarch64-unknown-linux-musl-gcc
          else
            export CC=aarch64-linux-musl-gcc
          fi
          echo "Using CC=$CC"
          ./configure \
            --target=aarch64-linux-musl \
            --prefix=$PWD/dist \
            --syslibdir=$PWD/dist

      - name: Build musl
        run: |
          if command -v aarch64-unknown-linux-musl-gcc >/dev/null 2>&1; then
            export CC=aarch64-unknown-linux-musl-gcc
          else
            export CC=aarch64-linux-musl-gcc
          fi
          make -j$(nproc) CC="$CC"

      - name: Install to dist
        run: make install

      - name: Verify and rename
        run: |
          test -f dist/lib/libc.so || { echo "::error::libc.so missing"; ls -la dist/lib/ 2>/dev/null; exit 1; }
          file dist/lib/libc.so
          cp dist/lib/libc.so dist/ld-musl-aarch64.so.1

      - uses: actions/upload-artifact@v4
        with:
          name: musl-termux-aarch64
          path: |
            dist/ld-musl-aarch64.so.1
            dist/lib/
            dist/include/
          retention-days: 30
