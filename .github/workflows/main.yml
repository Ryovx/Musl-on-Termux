name: Build patched musl for Termux (native aarch64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    # runner aarch64 حقيقي من GitHub
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner architecture
        run: |
          uname -m          # لازم يطلع aarch64
          gcc --version
          gcc -dumpmachine  # aarch64-linux-gnu

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Configure musl
        run: |
          ./configure \
            --target=aarch64-linux-musl \
            --prefix=$PWD/dist \
            --syslibdir=$PWD/dist

      - name: Build musl
        run: make -j$(nproc)

      - name: Install
        run: make install

      - name: Verify and prepare artifact
        run: |
          test -f dist/lib/libc.so || { echo "::error::libc.so not found"; ls -la dist/; exit 1; }
          file dist/lib/libc.so
          cp dist/lib/libc.so dist/ld-musl-aarch64.so.1

      - uses: actions/upload-artifact@v4
        with:
          name: musl-termux-aarch64
          path: |
            dist/ld-musl-aarch64.so.1
            dist/lib/
            dist/include/
          retention-days: 30
