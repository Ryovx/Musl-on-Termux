name: Build patched musl for Termux (Bootlin cross-toolchain)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Bootlin aarch64-musl cross toolchain
        run: |
          URL="https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--musl--stable-2024.02-1.tar.xz"
          for i in 1 2 3; do
            if curl -fsSL --connect-timeout 30 --max-time 600 "$URL" -o bootlin.txz; then
              break
            fi
            echo "Retry $i failed, waiting..."
            sleep 10
          done
          test -f bootlin.txz || { echo "::error::download failed"; exit 1; }
          tar -xJf bootlin.txz
          TOOLCHAIN_DIR=$(find $PWD -maxdepth 1 -type d -name "aarch64--*" | head -1)
          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR" >> $GITHUB_ENV
          echo "=== Toolchain bin ==="
          ls -la "$TOOLCHAIN_DIR/bin/" | head -30

      - name: Verify gcc is x86_64 and works
        run: |
          GCC="$TOOLCHAIN_DIR/bin/aarch64-buildroot-linux-musl-gcc"
          if [ ! -x "$GCC" ]; then
            echo "::error::gcc not found at $GCC"
            ls "$TOOLCHAIN_DIR/bin/"
            exit 1
          fi
          file "$GCC"
          "$GCC" --version | head -2

      - name: Configure musl
        run: |
          GCC="$TOOLCHAIN_DIR/bin/aarch64-buildroot-linux-musl-gcc"
          CC="$GCC" ./configure \
            --target=aarch64-linux-musl \
            --prefix=$PWD/dist \
            --syslibdir=$PWD/dist

      - name: Build musl
        run: |
          GCC="$TOOLCHAIN_DIR/bin/aarch64-buildroot-linux-musl-gcc"
          make -j$(nproc) CC="$GCC"

      - name: Install
        run: make install

      - name: Verify and prepare artifact
        run: |
          test -f dist/lib/libc.so || { echo "::error::libc.so not found"; ls -la dist/; exit 1; }
          file dist/lib/libc.so
          cp dist/lib/libc.so dist/ld-musl-aarch64.so.1

      - uses: actions/upload-artifact@v4
        with:
          name: musl-termux-aarch64
          path: |
            dist/ld-musl-aarch64.so.1
            dist/lib/
            dist/include/
          retention-days: 30
