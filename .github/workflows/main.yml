name: Build patched musl for Termux (prebuilt toolchain)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt musl-cross toolchain (aarch64, GCC 16)
        run: |
          URL="https://github.com/AmanoTeam/musl-gcc-cross/releases/download/gcc-16/aarch64-unknown-linux-musl.tar.xz"
          for i in 1 2 3; do
            if curl -fsSL --connect-timeout 30 --max-time 600 "$URL" -o toolchain.tar.xz; then
              break
            fi
            echo "Retry $i failed, waiting..."
            sleep 10
          done
          test -f toolchain.tar.xz || { echo "::error::download failed"; exit 1; }
          tar -xJf toolchain.tar.xz
          ls -la musl-gcc-cross/aarch64-unknown-linux-musl/bin/ | head

      - name: Add toolchain to PATH
        run: |
          TOOLCHAIN_DIR="$PWD/musl-gcc-cross/aarch64-unknown-linux-musl"
          if [ ! -d "$TOOLCHAIN_DIR/bin" ]; then
            echo "::error::toolchain bin dir not found at $TOOLCHAIN_DIR/bin"
            find $PWD -maxdepth 4 -type d -name bin
            exit 1
          fi
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH
          echo "Toolchain dir: $TOOLCHAIN_DIR"

      - name: Verify toolchain
        run: |
          which aarch64-unknown-linux-musl-gcc || true
          aarch64-unknown-linux-musl-gcc --version

      - name: Configure musl
        run: |
          CC=aarch64-unknown-linux-musl-gcc ./configure \
            --target=aarch64-linux-musl \
            --prefix=$PWD/dist \
            --syslibdir=$PWD/dist

      - name: Build musl
        run: make -j$(nproc) CC=aarch64-unknown-linux-musl-gcc

      - name: Install to dist
        run: make install

      - name: Verify and rename
        run: |
          test -f dist/lib/libc.so || { echo "::error::libc.so missing"; ls -la dist/lib/ 2>/dev/null; exit 1; }
          file dist/lib/libc.so
          cp dist/lib/libc.so dist/ld-musl-aarch64.so.1

      - uses: actions/upload-artifact@v4
        with:
          name: musl-termux-aarch64
          path: |
            dist/ld-musl-aarch64.so.1
            dist/lib/
            dist/include/
          retention-days: 30
